<header style="display: flex; justify-content: space-between; align-items: center; padding: 16px 30px; background: rgba(15, 23, 42, 0.75); backdrop-filter: blur(12px); border-bottom: 1px solid var(--border-glow); margin-bottom: 30px;">
    
    <!-- Lado Esquerdo: Logótipo / Nome do Portal -->
    <div style="display: flex; align-items: center; gap: 12px;">
        <a href="{% url 'mural_publico' %}" style="text-decoration: none; color: var(--text-light); font-weight: 800; font-size: 1.15rem; display: flex; align-items: center; gap: 8px;">
            <span style="font-size: 1.3rem;">🎓</span>
            <span class="gradient-text">School Feed</span>
        </a>
    </div>

    <!-- Lado Direito: Ações de Sessão e Painel -->
    <div style="display: flex; align-items: center; gap: 14px;">
        {% if user.is_authenticated %}
            <!-- Botão do Painel Admin / Dashboard -->
            <a href="{% url 'mural_lista' %}" class="btn-gradient" style="padding: 8px 16px; font-size: 0.85rem; text-decoration: none; display: flex; align-items: center; gap: 6px; font-weight: 600;">
                📊 Painel Admin
            </a>

            <!-- Distintivo do Utilizador Logado -->
            <div style="display: flex; align-items: center; gap: 8px; background: rgba(255, 255, 255, 0.05); padding: 6px 14px; border-radius: 20px; border: 1px solid rgba(255, 255, 255, 0.1);">
                <span style="width: 8px; height: 8px; background-color: #10b981; border-radius: 50%; display: inline-block;"></span>
                <span style="font-size: 0.85rem; color: var(--text-light); font-weight: 600;">{{ user.username }}</span>
            </div>

            <!-- Botão de Sair (Logout) -->
            <form action="{% url 'logout' %}" method="post" style="display: inline; margin: 0;">
                {% csrf_token %}
                <button type="submit" style="background: rgba(239, 68, 68, 0.12); color: #f87171; border: 1px solid rgba(239, 68, 68, 0.3); padding: 8px 14px; border-radius: 8px; font-size: 0.85rem; font-weight: 600; cursor: pointer; transition: all 0.2s ease;">
                    🚪 Sair
                </button>
            </form>
        {% else %}
            <!-- Botão para Iniciar Sessão (Visitantes) -->
            <a href="{% url 'login' %}" class="btn-gradient" style="padding: 8px 20px; font-size: 0.85rem; text-decoration: none; font-weight: 600;">
                🔑 Entrar
            </a>
        {% endif %}
    </div>
</header>
