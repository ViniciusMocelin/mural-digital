{% load static %}
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>School Feed - Colégio Estadual Augusto Vanin</title>
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body>
    <div class="app-layout" style="display: flex; min-height: 100vh;">
        <!-- Barra Lateral -->
        {% block sidebar %}
            {% include 'components/_sidebar.html' %}
        {% endblock %}

        <!-- Área Principal de Conteúdo -->
        <div style="flex: 1; display: flex; flex-direction: column; min-width: 0;">
            {% block topbar %}
                {% include 'components/_topbar.html' %}
            {% endblock %}

            <main class="main-content" style="padding: 0 30px 40px 30px; flex: 1;">
                {% block content %}{% endblock %}
            </main>
        </div>
    </div>
</body>
</html>
